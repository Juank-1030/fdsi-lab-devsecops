name: Security CI

on:
  push:
    branches: [ "main", "security/lab-fsi" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Semgrep
        run: python -m pip install semgrep
      - name: Ejecutar Semgrep SAST
        run: semgrep scan --config auto --error || true

  secrets-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Ejecutar Gitleaks
        run: gitleaks detect --source . -v || true

  sast-codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Analisis CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  dast-zap:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install
      - name: Iniciar aplicacion en segundo plano
        run: node index.js &
      - name: Esperar a que inicie el servidor
        run: sleep 5
      - name: Ejecutar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          allow_issue_writing: false
          fail_action: false